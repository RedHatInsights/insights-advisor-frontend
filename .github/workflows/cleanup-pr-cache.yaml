name: Cleanup PR cache

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup PR branch cache
        run: |
          echo "Cleaning up cache for PR #${PR_NUMBER}"
          echo "Branch: ${HEAD_REF}"

          for ref in "refs/pull/${PR_NUMBER}/merge" "refs/heads/${HEAD_REF}"; do
            echo "Trying ref: $ref"
            gh cache list --limit 1000 --ref "$ref" --json id,ref --jq '.[] | "\(.id) \(.ref)"' | while read cache_id cache_ref; do
              echo "Deleting cache ID: $cache_id (ref: $cache_ref)"
              gh cache delete "$cache_id" || echo "Failed to delete cache $cache_id, continuing..."
            done
          done

          echo "Deleting caches with exact scope match: ${HEAD_REF}"
          gh cache list --limit 1000 --json id,key | jq --arg SCOPE "${HEAD_REF}" '.[] | select(.key | split(",") | any(. == "scope=" + $SCOPE)) | .id' | while read cache_id; do
            echo "Deleting scoped cache ID: $cache_id"
            gh cache delete "$cache_id" || echo "Failed to delete cache $cache_id, continuing..."
          done

          echo "Cache cleanup completed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
