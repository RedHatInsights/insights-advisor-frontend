name: Cleanup stale caches

on:
  schedule:
    # Run once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup stale and closed PR caches
        run: |
          echo "Fetching cache list..."
          gh cache list --limit 1000 --json id,ref,key | jq -c '.[]' | while read -r cache; do
            CACHE_ID=$(echo "$cache" | jq -r '.id')
            CACHE_REF=$(echo "$cache" | jq -r '.ref')
            CACHE_KEY=$(echo "$cache" | jq -r '.key')

            # Handle PR merge refs: refs/pull/<number>/merge
            if [[ "$CACHE_REF" =~ refs/pull/([0-9]+)/merge ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
              PR_STATE=$(gh pr view "$PR_NUM" --repo "$GH_REPO" --json state --jq .state 2>/dev/null || echo "NOT_FOUND")

              if [[ "$PR_STATE" == "CLOSED" || "$PR_STATE" == "MERGED" || "$PR_STATE" == "NOT_FOUND" ]]; then
                echo "PR #$PR_NUM is $PR_STATE. Deleting cache ID: $CACHE_ID (ref: $CACHE_REF)"
                gh cache delete "$CACHE_ID" || true
              fi
            fi
          done

          echo "Scheduled cache cleanup completed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
